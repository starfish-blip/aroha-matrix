<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AROHA Matrix - 48B FFT + Mic + UBO Dome</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050a14; color: #00ebcc; font-family: Consolas, monospace; }
    #aroha-canvas { width: 100vw; height: 100vh; display: block; }
    #hud { position: fixed; top: 16px; left: 16px; background: rgba(5, 12, 24, 0.90); border: 1px solid #00ebcc; padding: 16px; border-radius: 8px; width: 380px; backdrop-filter: blur(8px); }
    h2 { margin: 0 0 6px 0; font-size: 15px; letter-spacing: 1px; color: #fff; }
    #lunar-banner { background: rgba(0, 235, 204, 0.1); border-left: 3px solid #facc15; padding: 8px; margin-bottom: 10px; border-radius: 4px; }
    #lunar-phase-title { font-weight: bold; color: #facc15; font-size: 13px; }
    #lunar-phase-desc { font-size: 11px; color: #d1fae5; margin-top: 4px; line-height: 1.35; }
    .row { margin: 7px 0; display: flex; flex-direction: column; font-size: 11px; }
    .chk-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #facc15; margin: 6px 0; }
    input[type="range"] { width: 100%; accent-color: #00ebcc; margin-top: 3px; }
    .fft-grid { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(0, 235, 204, 0.25); }
    .meter-row { display: flex; align-items: center; gap: 8px; font-size: 10px; margin: 4px 0; }
    .meter-label { width: 85px; color: #9be7ff; }
    .meter-track { flex: 1; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
    .meter-fill { height: 100%; width: 0%; background: #00ebcc; transition: width 0.05s linear; }
    #bar-mid { background: #facc15; }
    #bar-high { background: #c084fc; }
    #bar-wai { background: #ff4d4d; }
    button { background: #00ebcc; color: #050a14; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 8px; }
    #btn-mic { background: #facc15; color: #050a14; }
    #ubo-readout { font-size: 11px; margin-top: 6px; color: #9be7ff; }
  </style>
</head>
<body>
  <canvas id="aroha-canvas"></canvas>
  <div id="hud">
    <h2>AROHA MATRIX // MIC + FFT DOME</h2>
    <div id="lunar-banner">
      <div id="lunar-phase-title">CONNECTING MARAMATAKA ENGINE...</div>
      <div id="lunar-phase-desc">Awaiting FastAPI synodic telemetry...</div>
    </div>
    <div id="ubo-readout">UBO[48B] std140: initializing...</div>
    <label class="chk-row">
      <input id="chk-auto-lunar" type="checkbox" checked />
      Auto-Drive Dome & Audio from Maramataka
    </label>
    <div class="row">
      <label>Maramataka Night Cycle (0 = Live Astronomical Clock, 1-30 = Scrub)</label>
      <input id="slider-lunar-day" type="range" min="0" max="30" step="1" value="0" />
    </div>
    <div class="row">
      <label>Thermal Resonator Input (30.0 - 45.0 C | Baseline 36.6 C)</label>
      <input id="slider-temp" type="range" min="30" max="45" step="0.1" value="36.6" />
    </div>
    <div class="row">
      <label>Chladni Carrier Frequency (110 - 880 Hz)</label>
      <input id="slider-freq" type="range" min="110" max="880" step="1" value="432" />
    </div>
    <div class="row">
      <label>Binaural Entrainment Delta (0.5 - 40 Hz)</label>
      <input id="slider-delta" type="range" min="0.5" max="40" step="0.1" value="7.83" />
    </div>
    <div class="fft-grid">
      <div class="meter-row"><span class="meter-label">Z1 SUB (20-160)</span><div class="meter-track"><div id="bar-sub" class="meter-fill"></div></div></div>
      <div class="meter-row"><span class="meter-label">Z2 MID (160-2k)</span><div class="meter-track"><div id="bar-mid" class="meter-fill"></div></div></div>
      <div class="meter-row"><span class="meter-label">Z3 HIGH (2k-12k)</span><div class="meter-track"><div id="bar-high" class="meter-fill"></div></div></div>
      <div class="meter-row"><span class="meter-label">WAI FLUX (1+1=3)</span><div class="meter-track"><div id="bar-wai" class="meter-fill"></div></div></div>
    </div>
    <button id="btn-audio">Start Binaural + FFT Audio</button>
    <button id="btn-mic">Enable Live Microphone / Line-In</button>
  </div>
  <script type="module" src="/dist/bundle.js"></script>
</body>
</html>
