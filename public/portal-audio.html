<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AROHA 33-Vertebrae Dichotic Entrainment</title>
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #070b12;
      color: #e2e8f0;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    button, select {
      background: #1e293b;
      color: #5eead4;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.55rem 0.9rem;
      font-family: inherit;
      cursor: pointer;
      margin-right: 0.5rem;
    }
    button:hover { border-color: #5eead4; }
    pre {
      background: #020617;
      padding: 0.85rem;
      border-radius: 6px;
      overflow-x: auto;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>AROHA Portal Dichotic Binaural Engine (:3013)</h2>
    <p>Headphones required for dichotic StereoPannerNode isolation (L = -1.0, R = +1.0).</p>
    <div>
      <button id="btnStart">Engaged Sync &amp; Start Audio</button>
      <button id="btnStop">Fade Out</button>
      <select id="focusSelect">
        <option value="10">Focus 10 (7.5 Hz Theta)</option>
        <option value="12" selected>Focus 12 (4.0 Hz Theta-Delta)</option>
        <option value="15">Focus 15 (2.5 Hz Delta)</option>
        <option value="21">Focus 21 (1.5 Hz Epsilon)</option>
      </select>
      <button id="btnPushFocus">POST Focus State</button>
    </div>
  </div>

  <div class="card">
    <div id="readout">Status: Idle</div>
    <pre id="jsonOut">Click "Engaged Sync &amp; Start Audio" to query /api/v1/portal/state...</pre>
  </div>

  <script type="module">
    import { PortalBinauralEngine } from '/js/portal_binaural.js';

    const engine = new PortalBinauralEngine('/api/v1/portal/state');
    const readout = document.getElementById('readout');
    const jsonOut = document.getElementById('jsonOut');

    function render(state, tuning) {
      readout.textContent =
        `Gateway: ${state.gateway} | Focus ${tuning.focusState} | ` +
        `L: ${tuning.leftHz} Hz | R: ${tuning.rightHz} Hz | Beat: ${tuning.offsetHz} Hz`;
      jsonOut.textContent = JSON.stringify(state, null, 2);
    }

    document.getElementById('btnStart').addEventListener('click', async () => {
      try {
        const { state, tuning } = await engine.startFromPortal(0.22);
        render(state, tuning);
      } catch (err) {
        readout.textContent = `Blocked: ${err.message}`;
      }
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      engine.stop();
      readout.textContent = 'Status: Audio faded out';
    });

    document.getElementById('btnPushFocus').addEventListener('click', async () => {
      const focusState = Number(document.getElementById('focusSelect').value);
      const res = await fetch('/api/v1/portal/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          vertebrae_count: 33,
          chladni_mode: [5, 7],
          harmonic_lock: true,
          focus_state: focusState,
        }),
      });
      const updated = await res.json();
      const { state, tuning } = await engine.syncLive();
      render(state, tuning);
      jsonOut.textContent = JSON.stringify(updated, null, 2);
    });
  </script>
</body>
</html>
