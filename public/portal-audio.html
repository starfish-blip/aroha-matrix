<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AROHA 33-Vertebrae Dichotic Entrainment + Phase 2 Morse</title>
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #070b12;
      color: #e2e8f0;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.65rem; }
    button, select {
      background: #1e293b;
      color: #5eead4;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.55rem 0.9rem;
      font-family: inherit;
      cursor: pointer;
    }
    button:hover { border-color: #5eead4; }
    .morse-banner {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.75rem;
      color: #fbbf24;
      margin-top: 0.75rem;
    }
    pre {
      background: #020617;
      padding: 0.85rem;
      border-radius: 6px;
      overflow-x: auto;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>AROHA Portal Dichotic Engine + Phase 2 Morse Beacon (:3013)</h2>
    <p>Dichotic L/R oscillators (-1.0 / +1.0 pan) + 408.3 Hz (3x harmonic) center-panned Phase 2 Morse clue.</p>
    <div class="row">
      <button id="btnStart">1. Unlock Sync &amp; Start Audio</button>
      <button id="btnReplayMorse">2. Replay Phase 2 Morse Hint</button>
      <button id="btnToggleMorse">Morse Loop: ON</button>
      <button id="btnStop">Fade Out</button>
    </div>
    <div class="row">
      <select id="focusSelect">
        <option value="10">Focus 10 (7.5 Hz Theta)</option>
        <option value="12" selected>Focus 12 (4.0 Hz Theta-Delta)</option>
        <option value="15">Focus 15 (2.5 Hz Delta)</option>
        <option value="21">Focus 21 (1.5 Hz Epsilon)</option>
      </select>
      <button id="btnPushFocus">POST Focus State</button>
    </div>
    <div class="morse-banner" id="morseBanner">Phase 2 Beacon: awaiting aroha-33-verified unlock...</div>
  </div>

  <div class="card">
    <div id="readout">Status: Idle</div>
    <pre id="jsonOut">Click "Unlock Sync &amp; Start Audio" to query /api/v1/portal/state...</pre>
  </div>

  <script type="module">
    import { PortalBinauralEngine } from '/js/portal_binaural.js';

    const readout = document.getElementById('readout');
    const jsonOut = document.getElementById('jsonOut');
    const morseBanner = document.getElementById('morseBanner');
    const btnToggleMorse = document.getElementById('btnToggleMorse');

    const engine = new PortalBinauralEngine('/api/v1/portal/state', {
      morseEnabled: true,
      morseLoop: true,
      onMorseEvent: (ev) => {
        if (ev.type === 'morse_started') {
          morseBanner.textContent = `[${ev.cipherId} @ ${ev.beaconHz} Hz] TX: "${ev.plaintext}" (${ev.encoded})`;
        } else if (ev.type === 'morse_char') {
          morseBanner.textContent = `[${ev.cipherId} @ ${ev.beaconHz} Hz] Keying '${ev.char}' (${ev.pattern}) | ${ev.encoded}`;
        } else if (ev.type === 'morse_stopped') {
          morseBanner.textContent = 'Phase 2 Beacon: standby';
        }
      },
    });

    function render(state, tuning) {
      readout.textContent =
        `Gateway: ${state.gateway} | Token: ${state.token} | Focus ${tuning.focusState} | ` +
        `L: ${tuning.leftHz} Hz | R: ${tuning.rightHz} Hz | Beacon: ${tuning.morseHz} Hz`;
      jsonOut.textContent = JSON.stringify(state, null, 2);
    }

    document.getElementById('btnStart').addEventListener('click', async () => {
      try {
        const { state, tuning } = await engine.startFromPortal(0.22);
        render(state, tuning);
      } catch (err) {
        readout.textContent = `Blocked: ${err.message}`;
      }
    });

    document.getElementById('btnReplayMorse').addEventListener('click', () => {
      try {
        engine.playMorseHint();
      } catch (err) {
        morseBanner.textContent = `Blocked: ${err.message}`;
      }
    });

    btnToggleMorse.addEventListener('click', () => {
      engine.morseEnabled = !engine.morseEnabled;
      btnToggleMorse.textContent = `Morse Loop: ${engine.morseEnabled ? 'ON' : 'OFF'}`;
      if (!engine.morseEnabled) {
        engine.stopMorseHint();
      } else if (engine.isRunning) {
        engine.playMorseHint();
      }
    });

    document.getElementById('btnStop').addEventListener('click', () => {
      engine.stop();
      readout.textContent = 'Status: Audio faded out';
    });

    document.getElementById('btnPushFocus').addEventListener('click', async () => {
      const focusState = Number(document.getElementById('focusSelect').value);
      const res = await fetch('/api/v1/portal/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          vertebrae_count: 33,
          chladni_mode: [5, 7],
          harmonic_lock: true,
          focus_state: focusState,
        }),
      });
      const updated = await res.json();
      const { state, tuning } = await engine.syncLive();
      render(state, tuning);
      jsonOut.textContent = JSON.stringify(updated, null, 2);
    });
  </script>
</body>
</html>
