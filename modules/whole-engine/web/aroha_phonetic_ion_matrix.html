<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AROHA // PHONETIC-IONIC MATRIX (H - F - K - E)</title>
<style>
  body { margin: 0; background: #090b10; color: #e2e8f0; font-family: monospace; display: flex; height: 100vh; overflow: hidden; }
  #panel { width: 340px; background: #111622; padding: 18px; border-right: 1px solid #263147; box-sizing: border-box; overflow-y: auto; }
  h2 { margin: 0 0 10px 0; font-size: 14px; color: #38bdf8; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  button { padding: 9px; background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; font-family: monospace; font-weight: bold; cursor: pointer; }
  button.active { background: #38bdf8; color: #090b10; }
  .ctrl { margin-bottom: 14px; }
  label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
  input[type=range] { width: 100%; accent-color: #38bdf8; }
  .status { padding: 10px; background: #090b10; border: 1px solid #1e293b; font-size: 11px; line-height: 1.6; }
  canvas { flex: 1; display: block; }
</style>
</head>
<body>
<div id="panel">
  <h2>PHONETIC // IONIC MATRIX</h2>
  <button id="audioBtn" style="width:100%; margin-bottom:10px;">AUDIO SYNTH: OFF (33Hz ION)</button>
  <label>3-Stroke Glyph Mode (Inside O Boundary):</label>
  <div class="btn-row">
    <button class="glyphBtn active" data-g="E">OLE / E (Detached)</button>
    <button class="glyphBtn" data-g="H">H (pH Mirror)</button>
    <button class="glyphBtn" data-g="F">WH = PH = F</button>
    <button class="glyphBtn" data-g="K">K (Velar / K+ Ion)</button>
  </div>
  <div class="ctrl">
    <label>pH Scale (0 Acidic - 7 Mirror - 14 Alkaline): <span id="vPh">7</span></label>
    <input type="range" id="sPh" min="0" max="14" step="1" value="7">
  </div>
  <div class="ctrl">
    <label>90° Axis Tilt (tiki_tilt): <span id="vRot">0</span>°</label>
    <input type="range" id="sRot" min="0" max="270" step="90" value="0">
  </div>
  <div class="status" id="info"></div>
</div>
<canvas id="cv"></canvas>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;
function resize() { W = cv.width = window.innerWidth - 340; H = cv.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

let glyph = 'E', actx = null, soundOn = false;
let osc33, osc22, oscHarm;

function updateState() {
  const ph = parseInt(document.getElementById('sPh').value);
  const rot = parseInt(document.getElementById('sRot').value);
  document.getElementById('vPh').textContent = ph;
  document.getElementById('vRot').textContent = rot;

  const desc = {
    'E': 'OLE -> WHOLE: L-frame + detached unequal planes.',
    'H': 'pH Mirror: Two vertical pillars bridged across the center.',
    'F': 'Te Reo WH = PH = /f/: Bilabial fricative 3-stroke wave.',
    'K': 'K (/k/ Plosive & K+ Intracellular Ion): 90° center reflection.'
  }[glyph];

  const kRatio = (0.50 + ((ph - 7) / 14.0) * 0.40).toFixed(3);
  document.getElementById('info').innerHTML =
    `GLYPH: <b>${glyph}</b><br>${desc}<br><br>` +
    `STEP: ${ph + 1} / 15 | pH: ${ph} ${ph === 7 ? '(NEUTRAL MIRROR)' : ''}<br>` +
    `K+ / H+ ION RATIO: ${kRatio}<br>TRIAD: 11Hz / 22Hz / 33Hz`;

  if (soundOn && actx) {
    const mult = 1 + (rot / 360) * 0.125;
    osc33.frequency.setTargetAtTime(33 * mult, actx.currentTime, 0.04);
    osc22.frequency.setTargetAtTime(22 * mult, actx.currentTime, 0.04);
    oscHarm.frequency.setTargetAtTime(66 * kRatio * (glyph === 'K' ? 1.5 : 1.0), actx.currentTime, 0.04);
  }
}

document.querySelectorAll('.glyphBtn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.glyphBtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    glyph = btn.dataset.g;
    updateState();
  };
});

document.getElementById('audioBtn').onclick = () => {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const g = actx.createGain(); g.gain.value = 0.22; g.connect(actx.destination);
    osc33 = actx.createOscillator(); osc22 = actx.createOscillator(); oscHarm = actx.createOscillator();
    oscHarm.type = 'triangle';
    [osc33, osc22, oscHarm].forEach(o => { o.connect(g); o.start(); });
  }
  soundOn = !soundOn;
  if (soundOn) { actx.resume(); document.getElementById('audioBtn').textContent = 'AUDIO SYNTH: ON (33Hz ION)'; document.getElementById('audioBtn').classList.add('active'); }
  else { actx.suspend(); document.getElementById('audioBtn').textContent = 'AUDIO SYNTH: OFF (33Hz ION)'; document.getElementById('audioBtn').classList.remove('active'); }
  updateState();
};

['sPh', 'sRot'].forEach(id => document.getElementById(id).oninput = updateState);
updateState();

let t = 0;
function draw() {
  t += 0.03;
  ctx.fillStyle = '#090b10'; ctx.fillRect(0, 0, W, H);
  const ph = parseInt(document.getElementById('sPh').value);
  const rot = parseInt(document.getElementById('sRot').value);
  const cx = W / 2, cy = H / 2, R = 175;

  // pH Mirror Line
  ctx.strokeStyle = ph === 7 ? 'rgba(16, 185, 129, 0.45)' : 'rgba(56, 189, 248, 0.2)';
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(cx, 40); ctx.lineTo(cx, H - 40); ctx.moveTo(40, cy); ctx.lineTo(W - 40, cy); ctx.stroke();
  ctx.setLineDash([]);

  ctx.save(); ctx.translate(cx, cy); ctx.rotate((rot * Math.PI) / 180);
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, R + Math.sin(t * 3) * 3, 0, Math.PI * 2); ctx.stroke();

  ctx.lineWidth = 10; ctx.lineCap = 'square'; ctx.strokeStyle = '#f8fafc';
  if (glyph === 'E') {
    ctx.beginPath(); ctx.moveTo(-70, -90); ctx.lineTo(-70, 90); ctx.lineTo(65, 90); ctx.stroke();
    ctx.strokeStyle = '#fbbf24'; ctx.beginPath(); ctx.moveTo(-35, 0); ctx.lineTo(45, 0); ctx.stroke();
    ctx.strokeStyle = '#38bdf8'; ctx.beginPath(); ctx.moveTo(-35, -90); ctx.lineTo(80, -90); ctx.stroke();
  } else if (glyph === 'H') {
    ctx.beginPath(); ctx.moveTo(-65, -90); ctx.lineTo(-65, 90); ctx.moveTo(65, -90); ctx.lineTo(65, 90); ctx.stroke();
    ctx.strokeStyle = '#10b981'; ctx.beginPath(); ctx.moveTo(-65, 0); ctx.lineTo(65, 0); ctx.stroke();
  } else if (glyph === 'F') {
    ctx.beginPath(); ctx.moveTo(-65, -90); ctx.lineTo(-65, 90); ctx.stroke();
    ctx.strokeStyle = '#38bdf8'; ctx.beginPath(); ctx.moveTo(-65, -90); ctx.lineTo(75, -90); ctx.stroke();
    ctx.strokeStyle = '#fbbf24'; ctx.beginPath(); ctx.moveTo(-65, -5); ctx.lineTo(40, -5); ctx.stroke();
  } else if (glyph === 'K') {
    ctx.beginPath(); ctx.moveTo(-65, -90); ctx.lineTo(-65, 90); ctx.stroke();
    ctx.strokeStyle = '#f43f5e'; ctx.beginPath(); ctx.moveTo(65, -85); ctx.lineTo(-65, 0); ctx.lineTo(65, 85); ctx.stroke();
  }
  ctx.restore();
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
