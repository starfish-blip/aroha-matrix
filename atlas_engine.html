<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>AROHA Engine - Atlas UI</title>
    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
        .hud { position: absolute; top: 20px; left: 20px; pointer-events: none; }
    </style>
</head>
<body>
    <div class='hud'>
        <h1>AROHA Harmonnic Instrument</h1>
        <p>Status: <span id='status'>Connecting...</span></p>
    </div>
    <div id='canvas-container'></div>
    <script>
        const ws = new WebSocket('ws://localhost:8765');
        ws.onopen = () => {
            console.log('AROHA Engine connected to local YAML executor.');
            document.getElementById('status').innerText = 'Online & Synchronized';
        };
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log('State updated from YAML:', data.label);
        };
    </script>
</body>
</html>
