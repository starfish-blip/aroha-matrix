<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Resonance & Diagnostic Widget</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --predicted-color: #38bdf8;
            --user-color: #f43f5e;
            --clear-color: #22c55e;
            --friction-color: #eab308;
            --knot-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .widget-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }

        .header h2 { margin: 0 0 4px 0; font-size: 1.25rem; }
        .header p { margin: 0; color: var(--text-sub); font-size: 0.875rem; }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #090d16;
            border-radius: 8px;
            border: 1px solid #1e293b;
            overflow: hidden;
            margin-bottom: 20px;
        }

        canvas { width: 100%; height: 100%; display: block; }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .metric-value { font-size: 1.5rem; font-weight: 700; font-family: monospace; }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        .controls { display: flex; flex-direction: column; gap: 12px; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .control-label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-sub); }

        input[type="range"] {
            width: 100%;
            accent-color: var(--user-color);
            background: #334155;
            border-radius: 4px;
            height: 6px;
            outline: none;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body>

<div class="widget-card">
    <div class="header">
        <h2>Channel Resonance Diagnostic</h2>
        <p>Aligning Predicted Trajectory (36.6 Cycle) vs. User Input</p>
    </div>

    <div class="canvas-container">
        <canvas id="resonanceCanvas"></canvas>
    </div>

    <div class="metrics-grid">
        <div class="metric-box">
            <div class="metric-label">Resonance Index (R)</div>
            <div class="metric-value" id="resonanceValue">0.0000</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">Channel State</div>
            <div id="statusBadge" class="status-badge">EVALUATING</div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <div class="control-label">
                <span>User Input Deviation (Frequency Offset)</span>
                <span id="offsetVal">0.0</span>
            </div>
            <input type="range" id="userOffset" min="-10" max="10" step="0.1" value="0">
        </div>
        <div class="control-group">
            <div class="control-label">
                <span>User Phase Lag (Temporal Friction)</span>
                <span id="lagVal">0.0</span>
            </div>
            <input type="range" id="userLag" min="-3.14" max="3.14" step="0.05" value="0">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background-color: var(--predicted-color);"></div>
            <span>Predicted Vector</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background-color: var(--user-color);"></div>
            <span>Actual Choice</span>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('resonanceCanvas');
    const ctx = canvas.getContext('2d');
    const offsetInput = document.getElementById('userOffset');
    const lagInput = document.getElementById('userLag');
    const offsetVal = document.getElementById('offsetVal');
    const lagVal = document.getElementById('lagVal');
    const resonanceValue = document.getElementById('resonanceValue');
    const statusBadge = document.getElementById('statusBadge');

    let time = 0;

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const width = canvas.width;
        const height = canvas.height;
        const centerY = height / 2;

        const offset = parseFloat(offsetInput.value);
        const lag = parseFloat(lagInput.value);

        offsetVal.textContent = offset.toFixed(1);
        lagVal.textContent = lag.toFixed(2);

        const delta = Math.abs(offset) * 0.15 + Math.abs(lag) * 0.4;
        const resonance = Math.exp(-delta);

        resonanceValue.textContent = resonance.toFixed(4);

        if (resonance >= 0.8) {
            statusBadge.textContent = "CLEAR SIGNAL";
            statusBadge.style.backgroundColor = "rgba(34, 197, 94, 0.2)";
            statusBadge.style.color = "var(--clear-color)";
            statusBadge.style.border = "1px solid var(--clear-color)";
        } else if (resonance >= 0.45) {
            statusBadge.textContent = "HARMONIC FRICTION";
            statusBadge.style.backgroundColor = "rgba(234, 179, 8, 0.2)";
            statusBadge.style.color = "var(--friction-color)";
            statusBadge.style.border = "1px solid var(--friction-color)";
        } else {
            statusBadge.textContent = "KNOT DETECTED";
            statusBadge.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
            statusBadge.style.color = "var(--knot-color)";
            statusBadge.style.border = "1px solid var(--knot-color)";
        }

        // Send updates out to index.html parent frame
        window.parent.postMessage({
            type: "RESONANCE_UPDATE",
            offset: offset,
            lag: lag,
            resonance: resonance
        }, "*");

        // Draw Reference Grid Line
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = '#1e293b';
        ctx.moveTo(0, centerY);
        ctx.lineTo(width, centerY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Predicted Wave
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#38bdf8';
        for (let x = 0; x < width; x++) {
            const freq = (36.6 / 1000); 
            const y = centerY + Math.sin(x * freq + time) * 40;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Draw User Choice Wave
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#f43f5e';
        for (let x = 0; x < width; x++) {
            const freq = ((36.6 + offset) / 1000); 
            const y = centerY + Math.sin(x * freq + time + lag) * 40;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        time += 0.03;
        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
