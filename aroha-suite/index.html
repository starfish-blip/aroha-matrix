<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AROHA Framework | starmaps13.com</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffff">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background: #0a0a0a; color: #00ffff; font-family: monospace; }
        h1 { margin-top: 0; color: #00ffff; text-shadow: 0 0 8px rgba(0, 255, 255, 0.5); }
        .zone-card { border: 1px solid #00ffff; padding: 15px; margin-bottom: 20px; border-radius: 4px; background: rgba(0,255,255,0.02); }
        .zone-title { font-weight: bold; font-size: 1.1em; margin-bottom: 12px; color: #00ffff; display: flex; justify-content: space-between; }
        .btn { background: #00ffff; color: #000; border: none; padding: 8px 12px; font-family: monospace; font-weight: bold; cursor: pointer; border-radius: 2px; margin: 3px; }
        .btn:hover { background: #80ffff; box-shadow: 0 0 6px #00ffff; }
        .spine-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; margin-top: 10px; }
        .spine-btn { background: rgba(0,255,255,0.1); color: #00ffff; border: 1px solid #00ffff; padding: 6px 0; font-size: 0.8em; text-align: center; cursor: pointer; }
        .spine-btn:hover { background: #00ffff; color: #000; }
        #tab3-portal-root { min-height: 220px; border: 1px dashed rgba(0,255,255,0.3); position: relative; }
        canvas#crtWaveform { width: 100%; height: 80px; background: #000; border: 1px solid rgba(0,255,255,0.4); margin-top: 10px; display: block; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #00ffff; padding: 8px; font-family: monospace; width: calc(100% - 110px); }
        .task-list { margin-top: 10px; list-style-type: square; padding-left: 20px; }
        .task-item { margin-bottom: 5px; }
        #swStatus { font-size: 0.75em; color: #00ff00; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>AROHA Master Portal <span id="swStatus">[PWA Offline Ready]</span></h1>

    <!-- Zone 1: Spatial AR Portal -->
    <div class="zone-card">
        <div class="zone-title">
            <span>Zone 1: Spatial AR Portal (Point 25)</span>
            <span style="font-size:0.8em; color:#888;">36.87° Tiki Tilt</span>
        </div>
        <div id="tab3-portal-root"></div>
    </div>

    <!-- Zone 2: Acoustic Resonator Hub & CRT Oscilloscope -->
    <div class="zone-card">
        <div class="zone-title">
            <span>Zone 2: Acoustic Resonator & CRT Oscilloscope</span>
            <span style="font-size:0.8em; color:#888;">+0.27 Hz Microtonal Shift</span>
        </div>
        <canvas id="crtWaveform"></canvas>
        <div style="font-size:0.85em; color:#aaa; margin-top:10px;">33-Node Vertebral Sound Gates (N1–N33):</div>
        <div class="spine-grid" id="spineContainer"></div>
    </div>

    <!-- Zone 3: Core Chamber Task & Maramataka Sync -->
    <div class="zone-card">
        <div class="zone-title">
            <span>Zone 3: Core Chamber & Maramataka Sync</span>
            <span style="font-size:0.8em; color:#ffd700;">Phase: Rākaunui (Full Moon)</span>
        </div>
        <div>
            <input type="text" id="taskInput" placeholder="Add local task / site measurement...">
            <button class="btn" onclick="addTask()">Add Task</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
    </div>

    <!-- Scripts -->
    <script src="aroha-state-bridge.js"></script>
    <script src="public/tab3-spatial-ar.js"></script>
    <script>
        function triggerNode(index) {
            window.dispatchEvent(new CustomEvent('AROHA_PLAY_SPINE_NODE', { 
                detail: { nodeIndex: index } 
            }));
        }

        // Task Persistence
        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem('aroha_tasks') || '[]');
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tasks.forEach((t) => {
                const li = document.createElement('li');
                li.className = 'task-item';
                li.innerText = t;
                list.appendChild(li);
            });
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;
            const tasks = JSON.parse(localStorage.getItem('aroha_tasks') || '[]');
            tasks.push(input.value.trim());
            localStorage.setItem('aroha_tasks', JSON.stringify(tasks));
            input.value = '';
            loadTasks();
        }

        // Real-Time CRT Oscilloscope Loop
        function initOscilloscope() {
            const canvas = document.getElementById('crtWaveform');
            const ctx = canvas.getContext('2d');
            
            function renderFrame() {
                requestAnimationFrame(renderFrame);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (window.ArohaBridge && window.ArohaBridge.analyser) {
                    const analyser = window.ArohaBridge.analyser;
                    const bufferLength = analyser.fftSize;
                    const dataArray = new Uint8Array(bufferLength);
                    analyser.getByteTimeDomainData(dataArray);

                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = '#00ffff';
                    ctx.beginPath();

                    const sliceWidth = canvas.width * 1.0 / bufferLength;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 128.0;
                        const y = v * canvas.height / 2;

                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);

                        x += sliceWidth;
                    }
                    ctx.lineTo(canvas.width, canvas.height / 2);
                    ctx.stroke();
                } else {
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)';
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height / 2);
                    ctx.lineTo(canvas.width, canvas.height / 2);
                    ctx.stroke();
                }
            }
            renderFrame();
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('[PWA] Service Worker Registered:', reg.scope))
                    .catch((err) => console.warn('[PWA] SW Registration Failed:', err));
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('spineContainer');
            if (container) {
                for (let i = 1; i <= 33; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'spine-btn';
                    btn.innerText = `N${i}`;
                    btn.onclick = () => triggerNode(i);
                    container.appendChild(btn);
                }
            }

            loadTasks();
            initOscilloscope();

            if (typeof ArohaSpatialARPortal !== 'undefined') {
                window.arPortal = new ArohaSpatialARPortal();
            }
        });
    </script>
</body>
</html>
