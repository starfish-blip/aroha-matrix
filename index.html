<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AROHA Matrix</title>
</head>
<body>

  <!-- Your existing AROHA Matrix HTML elements here -->

  <!-- Live Hermes Bridge -->
  <script>
    const hermes = new WebSocket('ws://localhost:8080');

    hermes.onopen = () => {
      console.log('[AROHA MATRIX] Connected to Hermes Stream');
    };

    hermes.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.adaptation_trigger) {
        const rawIntensity = data.adaptation_trigger.intensity_scalar;
        
        const offsetSlider = document.querySelector('input[type="range"]:nth-of-type(1)');
        const lagSlider = document.querySelector('input[type="range"]:nth-of-type(2)');

        if (offsetSlider) {
          offsetSlider.value = rawIntensity;
          offsetSlider.dispatchEvent(new Event('input'));
        }

        if (lagSlider && data.resonance) {
          lagSlider.value = (data.resonance.phase_offset_rad / (2 * Math.PI)).toFixed(2);
          lagSlider.dispatchEvent(new Event('input'));
        }
      }
    };
  </script>
</body>
</html>
