            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI;

            colors[i+1] = 0.85 + Math.random() * 0.15;

        }

        this.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9
        });

        this.scene.add(this.particles);

        this.animate();
    }

        this.turbulence = parseFloat(val);
    }

        this.frequency = freq;
    }

        this.symmetry = parseInt(sym);
    }

    toggleSynthesisDemonstration() {
        this.synthesisMode = !this.synthesisMode;
        return this.synthesisMode;
    }

    onWindowResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    }

        this.renderer.render(this.scene, this.camera);
    }

            keyEl.className = 'piano-key ' + k.type;
            keyEl.innerText = k.note;
            if (k.type === 'black') {
                keyEl.style.position = 'absolute';
                keyEl.style.left = k.offset + 'px';
            }
            keyEl.addEventListener('mousedown', () => {
                keyEl.classList.add('active');
                if (window.acousticEngine && window.acousticEngine.audioCtx) {
                    window.acousticEngine.playTone(k.freq);
                }
                if (window.arohaVisualizer) {
                    window.arohaVisualizer.setFrequency(k.freq);
                }
            });
            keyEl.addEventListener('mouseup', () => { keyEl.classList.remove('active'); });
            keyEl.addEventListener('mouseleave', () => { keyEl.classList.remove('active'); });
            pianoContainer.appendChild(keyEl);
        });

        // Initialize Audio & Faders
        document.getElementById('init-audio-btn').addEventListener('click', async () => {
            await window.acousticEngine.init();
            window.dspEngine.initEffects(window.acousticEngine.audioCtx, window.acousticEngine.masterGain);
            window.arohaVisualizer.init(window.acousticEngine);
            window.themeEngine.applyTheme('ocean', window.arohaVisualizer.layers);

            const container = document.getElementById('fader-bank-ui');
            container.innerHTML = '';

            if (window.acousticEngine.config && window.acousticEngine.config.fader_bank) {
                window.acousticEngine.config.fader_bank.forEach((fader, idx) => {
                    const col = document.createElement('div');
                    col.className = 'fader-col';
                    const freqLabel = fader.frequency > 1000 ? (fader.frequency/1000).toFixed(1) + 'k' : fader.frequency.toFixed(0);
                    col.innerHTML = 
                        <span> + freqLabel + </span>
                        <input type="range" min="-40" max="6" step="0.5" value="-40" data-fader=" + idx + ">
                        <span>F + (idx+1) + </span>
                    ;
                    container.appendChild(col);
                });

                container.querySelectorAll('input[type=range]').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const idx = parseInt(e.target.getAttribute('data-fader'));
                        const val = parseFloat(e.target.value);
                        window.acousticEngine.setFaderGain(idx, val);
                        const freq = window.acousticEngine.config.fader_bank[idx].frequency;
                        if (window.arohaVisualizer) window.arohaVisualizer.setFrequency(freq);
                        document.getElementById('freq-display').innerText = freq.toFixed(2) + ' Hz';
                    });
                });
            }
            document.getElementById('init-audio-btn').innerText = "Engine Active ?";
            document.getElementById('init-audio-btn').style.background = "#059669";
        });
    </script>
</body>
</html>
