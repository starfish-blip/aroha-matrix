<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroha System Workspace</title>
    <style>
        body { 
            margin: 0; 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            max-width: 700px; 
            margin: 0 auto; 
        }
        .panel { 
            background: #1e293b; 
            padding: 16px 24px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
        }
        .panel h2 { margin-top: 0; font-size: 1.2rem; }
        .panel p { margin-bottom: 0; color: #94a3b8; font-size: 0.9rem; }
        iframe { 
            width: 100%; 
            height: 560px; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            background: #0f172a;
        }
    </style>
</head>
<body>

<div class="grid">
    <div class="panel">
        <h2>System Workspace Baseline</h2>
        <p>Status: Aroha & Trinity Engine Pipeline Connected</p>
    </div>

    <!-- Diagnostic Visualizer Mount -->
    <iframe src="resonance_widget.html"></iframe>
</div>

<!-- Core Engine Scripts -->
<script src="aroha-engine.js"></script>
<script src="trinity-engine.js"></script>
<script>
    // Initialize Pipeline Bridge if available
    let pipeline;
    if (typeof SystemBridge !== 'undefined') {
        pipeline = new SystemBridge();
        console.log("SystemBridge Initialized Successfully.");
    } else {
        console.log("Waiting for Trinity/Aroha engine definitions...");
    }

    // Listen to real-time events from the resonance iframe
    window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "RESONANCE_UPDATE" && pipeline) {
            const output = pipeline.executeCycle(
                `Predicted Trajectory (36.6 Cycle)`,
                `User Offset: ${event.data.offset}, Lag: ${event.data.lag}`
            );
            console.log("Pipeline Cycle Execution Output:", output.emergentResult);
        }
    });
</script>
</body>
</html>
