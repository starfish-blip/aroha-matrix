<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0c">
  <title>AROHA 3-Zone Master Application</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/zones.css">
  <!-- Tone.js Audio Engine Dependency -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
  <div id="aroha-app" class="master-container">
    
    <!-- Zone 1: Spatial AR Portal -->
    <section id="zone-1" class="zone-panel">
      <header class="zone-header">
        <h2>Zone 1: Spatial AR Portal</h2>
      </header>
      <div id="ar-viewport" class="viewport-canvas">
        <p class="status-indicator">Viewport Active</p>
        <div id="spatial-readout" class="readout-box">Coordinates: X: 0.00 | Y: 0.00 | Z: 0.00</div>
      </div>
    </section>

    <!-- Zone 2: Acoustic Synthesizer Engine -->
    <section id="zone-2" class="zone-panel">
      <header class="zone-header">
        <h2>Zone 2: Acoustic Synthesizer</h2>
      </header>
      
      <div class="synth-controls">
        <button id="btn-synth-toggle" class="btn-primary">Initialize & Start Synth</button>
        <div id="telemetry-readout" class="readout-box">Status: Stopped</div>

        <!-- Oscilloscope Waveform Visualizer Canvas -->
        <canvas id="waveform-canvas" width="600" height="150"></canvas>

        <div class="control-group">
          <label for="carrier-slider">Carrier Frequency: <span id="val-carrier">432</span> Hz</label>
          <input type="range" id="carrier-slider" min="100" max="880" value="432" step="1">
        </div>

        <div class="control-group">
          <label for="harmonicity-slider">Harmonicity Ratio: <span id="val-harmonicity">1.5</span></label>
          <input type="range" id="harmonicity-slider" min="0.1" max="5.0" value="1.5" step="0.1">
        </div>

        <div class="control-group">
          <label for="mod-index-slider">Modulation Index: <span id="val-mod-index">10</span></label>
          <input type="range" id="mod-index-slider" min="0" max="50" value="10" step="1">
        </div>
      </div>
    </section>

    <!-- Zone 3: Task Manager & Maramataka Ledger -->
    <section id="zone-3" class="zone-panel">
      <header class="zone-header">
        <h2>Zone 3: Maramataka Ledger</h2>
      </header>
      <div id="ledger-container">
        <ul id="task-list">
          <li class="ledger-item"><span class="timestamp">[System]</span> AROHA Master Core Initialized</li>
        </ul>
      </div>
    </section>

  </div>

  <script src="assets/js/engines/synth.js"></script>
  <script src="assets/js/engines/recursive.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
