<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroha System Workspace</title>
    <style>
        body { 
            margin: 0; 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            max-width: 750px; 
            margin: 0 auto; 
        }
        .panel { 
            background: #1e293b; 
            padding: 16px 24px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel h2 { margin: 0; font-size: 1.2rem; }
        .panel p { margin-bottom: 6px; color: #94a3b8; font-size: 0.9rem; }
        
        .data-stream {
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            background: #090d16;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #1e293b;
            margin-top: 10px;
            word-break: break-all;
        }

        .hint-box {
            font-size: 0.8rem;
            color: #eab308;
            background: rgba(234, 179, 8, 0.1);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(234, 179, 8, 0.3);
            margin-top: 10px;
            display: none;
        }

        .alert-banner {
            font-size: 0.8rem;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.4);
            margin-top: 10px;
            display: none;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        .module-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .module-card:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }
        .module-card h4 { margin: 0 0 6px 0; font-size: 0.9rem; color: #f8fafc; }
        .module-card p { margin: 0; font-size: 0.75rem; color: #94a3b8; }
        .tag {
            display: inline-block;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #334155;
            color: #38bdf8;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }
        .metric-card {
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }
        .metric-card span { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
        .metric-card div { font-size: 1.2rem; font-weight: bold; color: #38bdf8; font-family: monospace; margin-top: 4px; }

        .ledger-box {
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 10px;
            max-height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 10px;
        }
        .ledger-entry {
            padding: 4px 0;
            border-bottom: 1px solid #1e293b;
        }
        .ledger-entry:last-child { border-bottom: none; }
        .highlight { color: #22c55e; font-weight: bold; }
        .alert-knot { color: #ef4444; font-weight: bold; }

        .button-group { display: flex; gap: 8px; }
        .btn-export, .btn-recalibrate, .btn-clear, .btn-fix {
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-export { background: #38bdf8; color: #0f172a; }
        .btn-export:hover { background: #7dd3fc; }
        .btn-recalibrate { background: #22c55e; color: #0f172a; }
        .btn-recalibrate:hover { background: #4ade80; }
        .btn-clear { background: #334155; color: #94a3b8; }
        .btn-clear:hover { background: #475569; color: #f8fafc; }
        .btn-fix { background: #ef4444; color: #ffffff; }
        .btn-fix:hover { background: #f87171; }

        iframe { 
            width: 100%; 
            height: 560px; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            background: #0f172a;
        }
    </style>
</head>
<body>

<div class="grid">
    <div class="panel">
        <h2 id="sysName">Loading AROHA Matrix...</h2>
        <p id="sysDetails" style="margin-top: 6px;">Status: Initializing Core State Schema...</p>
        
        <div class="data-stream" id="liveStream">Select a learning module to test resonance trajectory...</div>
        <div class="hint-box" id="hintBox"></div>
        <div class="alert-banner" id="alertBanner">
            <span>SYSTEM WARNING: Stability below 70%!</span>
            <button class="btn-fix" onclick="executeAutoRemediation()">Execute Auto-Remediation</button>
        </div>

        <div class="card-grid" id="cardContainer"></div>
    </div>

    <div class="panel">
        <h2>Session Telemetry Analytics</h2>
        <div class="analytics-grid">
            <div class="metric-card">
                <span>Avg Offset</span>
                <div id="metricAvgOffset">0.0</div>
            </div>
            <div class="metric-card">
                <span>Stability Index</span>
                <div id="metricStability">100%</div>
            </div>
            <div class="metric-card">
                <span>Total Cycles</span>
                <div id="metricCycles">0</div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <h2>Execution History Ledger</h2>
            <div class="button-group">
                <button class="btn-recalibrate" onclick="recalibrateSystem()">Auto Align</button>
                <button class="btn-export" onclick="exportLedgerData()">Export Log</button>
                <button class="btn-clear" onclick="clearHistory()">Clear</button>
            </div>
        </div>
        <div class="ledger-box" id="ledgerHistory"></div>
    </div>

    <iframe id="widgetIframe" src="resonance_widget.html"></iframe>
</div>

<script src="aroha-engine.js"></script>
<script src="trinity-engine.js"></script>
<script>
    let pipeline;
    let coreSchema = null;
    let lastOffset = null;
    let lastLag = null;
    let sessionHistory = JSON.parse(localStorage.getItem('aroha_history')) || [];

    fetch('matrix-core.json')
        .then(response => response.json())
        .then(data => {
            coreSchema = data;
            document.getElementById('sysName').textContent = data.system_info.name;
            document.getElementById('sysDetails').textContent = 
                `Harmonic Target: ${data.system_info.harmonic_target} | Synergy: ${data.system_info.synergy_mechanic} | Overage Threshold: ${data.system_info.overage_threshold}`;
            
            if (typeof SystemBridge !== 'undefined') {
                pipeline = new SystemBridge();
            }

            renderModuleCards(data.learning_modules);
            renderStoredLedger();
            updateAnalytics();
        })
        .catch(err => console.error("Could not load matrix-core.json:", err));

    function renderModuleCards(modules) {
        const container = document.getElementById('cardContainer');
        container.innerHTML = '';
        modules.forEach(mod => {
            const card = document.createElement('div');
            card.className = 'module-card';
            card.onclick = () => selectModule(mod.title, mod.offset, mod.lag, mod.hint);
            card.innerHTML = `
                <span class="tag">CYCLE ${mod.cycle_range}</span>
                <h4>${mod.title}</h4>
                <p>${mod.description}</p>
            `;
            container.appendChild(card);
        });
    }

    function appendToLedger(text, logObj) {
        const ledger = document.getElementById('ledgerHistory');
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = 'ledger-entry';
        entry.innerHTML = `<span class="highlight">[${time}]</span> ${text}`;
        ledger.prepend(entry);

        if (logObj) {
            sessionHistory.push({ time, ...logObj });
            localStorage.setItem('aroha_history', JSON.stringify(sessionHistory));
            updateAnalytics();
        }
    }

    function updateAnalytics() {
        const alertBanner = document.getElementById('alertBanner');
        if (sessionHistory.length === 0) {
            document.getElementById('metricAvgOffset').textContent = '0.0';
            document.getElementById('metricStability').textContent = '100%';
            document.getElementById('metricCycles').textContent = '0';
            alertBanner.style.display = 'none';
            return;
        }

        let totalOffset = 0;
        let highFrictionCount = 0;

        sessionHistory.forEach(item => {
            totalOffset += Math.abs(item.offset || 0);
            if (item.offset > 3.0 || item.lag > 0.8) {
                highFrictionCount++;
            }
        });

        const avgOffset = (totalOffset / sessionHistory.length).toFixed(1);
        const stabilityRate = Math.max(0, Math.round(((sessionHistory.length - highFrictionCount) / sessionHistory.length) * 100));

        document.getElementById('metricAvgOffset').textContent = avgOffset;
        document.getElementById('metricStability').textContent = `${stabilityRate}%`;
        document.getElementById('metricCycles').textContent = sessionHistory.length;

        if (stabilityRate < 70) {
            alertBanner.style.display = 'flex';
        } else {
            alertBanner.style.display = 'none';
        }
    }

    function executeAutoRemediation() {
        selectModule('Auto-Remediation Sequence', 0.0, 0.0, 'Remediation executed. Channel zeroed to baseline trajectory.');
        appendToLedger(`<span class="highlight">[REMEDIATION COMPLETE]</span> Automated vector correction applied.`);
    }

    function renderStoredLedger() {
        const ledger = document.getElementById('ledgerHistory');
        ledger.innerHTML = '';
        if (sessionHistory.length === 0) {
            ledger.innerHTML = '<div class="ledger-entry">System ready. Awaiting initial module selection...</div>';
            return;
        }
        sessionHistory.slice().reverse().forEach(item => {
            const entry = document.createElement('div');
            entry.className = 'ledger-entry';
            entry.innerHTML = `<span class="highlight">[${item.time}]</span> Executed ${item.module} -> Offset: ${item.offset}, Lag: ${item.lag} | Synergy: ${item.synergy}`;
            ledger.appendChild(entry);
        });
    }

    function selectModule(moduleName, offset, lag, hintText) {
        if (!pipeline) return;

        const output = pipeline.executeCycle(
            `Selected Module: [${moduleName}]`,
            `Trajectory Offset: ${offset}, Phase Lag: ${lag}`
        );

        const streamBox = document.getElementById('liveStream');
        streamBox.textContent = `Active Module: ${moduleName} | Emergent Payload: ${output.emergentResult.synthesisPayload} | Synergy: ${output.emergentResult.synergyFactor}`;

        const hintBox = document.getElementById('hintBox');
        if (hintText) {
            hintBox.textContent = `Diagnostic Prompt: ${hintText}`;
            hintBox.style.display = 'block';
        }

        const iframeWindow = document.getElementById('widgetIframe').contentWindow;
        iframeWindow.postMessage({
            type: "SET_MODULE_PARAMS",
            offset: offset,
            lag: lag
        }, "*");

        appendToLedger(`Executed ${moduleName} -> Offset: ${offset}, Lag: ${lag} | Synergy: ${output.emergentResult.synergyFactor}`, {
            module: moduleName, offset, lag, synergy: output.emergentResult.synergyFactor
        });
    }

    function recalibrateSystem() {
        selectModule('Recalibration Vector (Zero-Point)', 0.0, 0.0, 'System realigned to baseline equilibrium.');
        appendToLedger(`<span class="alert-knot">[RECALIBRATION]</span> Channel realigned to target baseline (36.6 Cycle).`);
    }

    function clearHistory() {
        sessionHistory = [];
        localStorage.removeItem('aroha_history');
        renderStoredLedger();
        updateAnalytics();
    }

    function exportLedgerData() {
        if (sessionHistory.length === 0) {
            alert("No session history recorded yet. Click a module card first!");
            return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sessionHistory, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `aroha_execution_log_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "RESONANCE_UPDATE" && pipeline) {
            if (event.data.offset !== lastOffset || event.data.lag !== lastLag) {
                lastOffset = event.data.offset;
                lastLag = event.data.lag;

                const output = pipeline.executeCycle(
                    `Phase Vector: ${coreSchema ? coreSchema.system_info.harmonic_target : 36.6}`,
                    `Offset: ${event.data.offset}, Lag: ${event.data.lag}`
                );
                
                const streamBox = document.getElementById('liveStream');
                streamBox.textContent = `Emergent State Output: ${output.emergentResult.synthesisPayload} | Synergy: ${output.emergentResult.synergyFactor}`;
            }
        }
    });
</script>
</body>
</html>
