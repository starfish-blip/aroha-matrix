<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AROHA Engine v34 - Unified Acoustic & Visualizer Matrix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #0a0a0c; color: #00f0ff; font-family: monospace; margin: 0; min-height: 150vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 150px 20px; box-sizing: border-box; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .dashboard-header { display: flex; align-items: center; gap: 20px; width: 100%; max-width: 950px; margin-bottom: 20px; }
        .panel { background: rgba(20, 20, 24, 0.85); border: 1px solid #1f1f28; padding: 15px; border-radius: 8px; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; }
        #cymatic-canvas { width: 160px; height: 160px; border-radius: 50%; border: 2px solid #00f0ff; background: #000; }
        .control-dock { background: rgba(20, 20, 24, 0.9); border: 1px solid #1f1f28; padding: 1.5rem; border-radius: 12px; width: 100%; max-width: 950px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; z-index: 10; }
        button, select { width: 100%; padding: 10px; background: #1f1f28; border: 1px solid #3a3a48; color: #fff; border-radius: 4px; font-family: monospace; cursor: pointer; }
        button:hover, select:hover { background: #2563eb; }
        .dock-row { display: flex; gap: 10px; align-items: center; }
        .fader-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; margin-top: 10px; }
        .fader-col { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: #9ca3af; }
        .fader-col input { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 24px; height: 120px; margin-bottom: 5px; accent-color: #00f0ff; }
        .active-step { color: #10b981 !important; text-shadow: 0 0 8px #10b981; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="dashboard-header">
        <div class="panel">
            <div style="font-size: 0.75rem; margin-bottom: 6px;">CYMATIC RESONANCE MAP</div>
            <canvas id="cymatic-canvas" width="160" height="160"></canvas>
            <div id="freq-display" style="font-size: 0.75rem; margin-top: 6px; color: #9ca3af;">432.00 Hz</div>
        </div>
    </div>

    <div class="control-dock">
        <h2>AROHA v34 // Tailscale Mesh Node Matrix</h2>
        <button id="init-audio-btn">Initialize Audio, MIDI & Visualizer Engine</button>
        
        <div class="dock-row">
            <select id="focus-preset">
                <option value="2.0">Gateway Focus 10 (Delta - 2.0 Hz)</option>
                <option value="6.0" selected>Gateway Focus 12 (Theta - 6.0 Hz)</option>
                <option value="10.0">Gateway Focus 15 (Alpha - 10.0 Hz)</option>
                <option value="40.0">Gateway Focus 21 (Gamma - 40.0 Hz)</option>
            </select>
            <button id="toggle-binaural">Start Binaural Entrainment</button>
        </div>

        <div class="dock-row">
            <select id="scale-select">
                <option value="pentatonic" selected>Scale: Pentatonic</option>
                <option value="dorian">Scale: Dorian</option>
                <option value="solfeggio">Scale: Solfeggio Diatonic</option>
            </select>
            <select id="symmetry-select">
                <option value="3">Symmetry: 3-Fold</option>
                <option value="4" selected>Symmetry: 4-Fold</option>
                <option value="5">Symmetry: 5-Fold</option>
                <option value="6">Symmetry: 6-Fold</option>
            </select>
            <select id="theme-select">
                <option value="ocean" selected>Theme: Deep Ocean</option>
                <option value="solar">Theme: Solar Gold</option>
                <option value="nebula">Theme: Nebula Violet</option>
                <option value="matrix">Theme: Matrix Green</option>
                <option value="cyan">Theme: Cyan</option>
                <option value="magenta">Theme: Magenta</option>
                <option value="yellow">Theme: Yellow</option>
            </select>
        </div>

        <div class="dock-row">
            <button id="latch-btn">Chord Latch / Drone Mode: OFF</button>
            <button id="live-mic-btn">Connect Live Guitar / Mic Input</button>
        </div>

        <div class="dock-row">
            <button id="synthesis-demo-btn" style="background: #1d4ed8;">Demonstrate Outer-to-Middle Synthesis: OFF</button>
        </div>

        <div class="dock-row" style="flex-direction: column; align-items: stretch; gap: 5px; font-size: 0.8rem; color: #9ca3af;">
            <span>Particle Turbulence Intensity (Mesh Coupled)</span>
            <input type="range" id="turbulence-slider" min="0.1" max="3.0" step="0.1" value="1.0" style="accent-color: #00f0ff; width: 100%;">
        </div>

        <div class="dock-row">
            <button id="octave-down">Octave Down (-)</button>
            <button id="octave-up">Octave Up (+)</button>
            <button id="panic-btn" style="background: #7f1d1d;">Panic / Mute All</button>
        </div>

        <div class="dock-row">
            <button id="save-preset-btn" style="background: #047857;">Save Preset Snapshot</button>
            <button id="load-preset-btn" style="background: #1d4ed8;">Load Preset Snapshot</button>
        </div>

        <div class="dock-row">
            <button id="record-btn" style="background: #b91c1c;">Start A/V Performance Recording</button>
        </div>

        <div style="font-size: 0.8rem; color: #9ca3af; margin-top: 5px;">Emergent Solfeggio Fader Bank (Oxygen 61 Linked)</div>
        <div class="fader-grid" id="fader-bank-ui"></div>
    </div>

    <div style="height: 300px; z-index: 10; display: flex; align-items: center; justify-content: center; color: #4b5563; font-size: 0.85rem;">
        [ AROHA Matrix Tailscale Mesh Visualizer Space ]
    </div>

    <script src="/static/js/audio-engine.js"></script>
    <script src="/static/js/visualizer-engine.js"></script>
    <script src="/static/js/cymatic-engine.js"></script>
    <script src="/static/js/binaural-engine.js"></script>
    <script src="/static/js/arpeggiator-engine.js"></script>
    <script src="/static/js/scale-engine.js"></script>
    <script src="/static/js/theme-engine.js"></script>
    <script src="/static/js/dsp-engine.js"></script>
    <script src="/static/js/recorder-engine.js"></script>
    <script src="/static/js/synergy-engine.js"></script>
    <script src="/static/js/mesh-bridge.js"></script>
    <script src="/static/js/midi-bridge.js"></script>

    <script>
        let currentOctaveShift = 0;

        document.getElementById('init-audio-btn').addEventListener('click', async () => {
            await window.acousticEngine.init();
            window.dspEngine.initEffects(window.acousticEngine.audioCtx, window.acousticEngine.masterGain);
            window.arohaVisualizer.init(window.acousticEngine);
            window.themeEngine.applyTheme('ocean', window.arohaVisualizer.layers);
            
            if (navigator.requestMIDIAccess) {
                navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
            }

            const container = document.getElementById('fader-bank-ui');
            container.innerHTML = '';
            
            if (window.acousticEngine.config && window.acousticEngine.config.fader_bank) {
                window.acousticEngine.config.fader_bank.forEach((fader, idx) => {
                    const col = document.createElement('div');
                    col.className = 'fader-col';
                    col.id = `fader-col-${idx}`;
                    const freqLabel = fader.frequency > 1000 ? (fader.frequency/1000).toFixed(1) + 'k' : fader.frequency.toFixed(0);
                    col.innerHTML = `
                        <span>${freqLabel}</span>
                        <input type="range" min="-40" max="6" step="0.5" value="-40" data-fader="${idx}">
                        <span>F${idx+1}</span>
                    `;
                    container.appendChild(col);
                });

                container.querySelectorAll('input[type=range]').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const idx = parseInt(e.target.getAttribute('data-fader'));
                        const val = parseFloat(e.target.value);
                        window.acousticEngine.setFaderGain(idx, val);
                        
                        const freq = window.acousticEngine.config.fader_bank[idx].frequency;
                        if (window.cymaticEngine) {
                            window.cymaticEngine.setFrequency(freq);
                            document.getElementById('freq-display').innerText = `${freq.toFixed(2)} Hz`;
                        }
                        if (window.arohaVisualizer && typeof window.arohaVisualizer.setFrequency === 'function') {
                            window.arohaVisualizer.setFrequency(freq);
                        }

                        if (window.synergyEngine && window.arohaVisualizer) {
                            window.synergyEngine.processSynergy(idx, val, 0.5, window.arohaVisualizer, window.themeEngine);
                        }
                    });
                });
            }
            
            document.getElementById('init-audio-btn').innerText = "Engine, MIDI & Visualizer Active ✓";
            document.getElementById('init-audio-btn').style.background = "#059669";
        });

        document.getElementById('scale-select').addEventListener('change', (e) => {
            const val = e.target.value;
            if (window.scaleEngine) window.scaleEngine.setScale(val);
            if (window.meshBridge) window.meshBridge.broadcastState('scale', val);
        });

        document.getElementById('symmetry-select').addEventListener('change', (e) => {
            const val = e.target.value;
            if (window.arohaVisualizer) window.arohaVisualizer.setSymmetry(val);
            if (window.meshBridge) window.meshBridge.broadcastState('symmetry', val);
        });

        document.getElementById('theme-select').addEventListener('change', (e) => {
            const val = e.target.value;
            if (window.themeEngine && window.arohaVisualizer) {
                window.themeEngine.applyTheme(val, window.arohaVisualizer.layers);
            }
            if (window.meshBridge) window.meshBridge.broadcastState('theme', val);
        });

        document.getElementById('latch-btn').addEventListener('click', () => {
            const state = window.arpeggiatorEngine.toggleLatch();
            const btn = document.getElementById('latch-btn');
            btn.innerText = `Chord Latch / Drone Mode: ${state ? 'ON' : 'OFF'}`;
            btn.style.background = state ? '#059669' : '#1f1f28';
        });

        document.getElementById('live-mic-btn').addEventListener('click', () => {
            if (!window.acousticEngine || !window.acousticEngine.audioCtx) {
                alert("Please initialize audio engine first.");
                return;
            }
            window.dspEngine.initLiveInput(window.acousticEngine.audioCtx, window.acousticEngine.masterGain);
        });

        document.getElementById('synthesis-demo-btn').addEventListener('click', () => {
            const state = window.arohaVisualizer.toggleSynthesisDemonstration();
            const btn = document.getElementById('synthesis-demo-btn');
            btn.innerText = `Demonstrate Outer-to-Middle Synthesis: ${state ? 'ON' : 'OFF'}`;
            btn.style.background = state ? '#059669' : '#1d4ed8';
        });

        document.getElementById('turbulence-slider').addEventListener('input', (e) => {
            const val = e.target.value;
            if (window.arohaVisualizer) window.arohaVisualizer.setTurbulence(val);
            if (window.meshBridge) window.meshBridge.broadcastState('turbulence', val);
        });

        document.getElementById('octave-down').addEventListener('click', () => {
            currentOctaveShift = Math.max(-2, currentOctaveShift - 1);
        });

        document.getElementById('octave-up').addEventListener('click', () => {
            currentOctaveShift = Math.min(2, currentOctaveShift + 1);
        });

        document.getElementById('panic-btn').addEventListener('click', () => {
            if (window.acousticEngine && window.acousticEngine.faderChannels) {
                window.acousticEngine.faderChannels.forEach((ch, idx) => {
                    ch.gainNode.gain.setValueAtTime(0, window.acousticEngine.audioCtx.currentTime);
                    const slider = document.querySelector(`input[data-fader="${idx}"]`);
                    if (slider) slider.value = -40;
                });
            }
            if (window.arpeggiatorEngine) {
                window.arpeggiatorEngine.activeNotes = [];
                window.arpeggiatorEngine.stop();
            }
        });

        document.getElementById('save-preset-btn').addEventListener('click', () => {
            const faderValues = [];
            document.querySelectorAll('input[data-fader]').forEach(input => {
                faderValues.push({ idx: input.getAttribute('data-fader'), value: input.value });
            });
            const preset = {
                faders: faderValues,
                focusPreset: document.getElementById('focus-preset').value,
                scale: document.getElementById('scale-select').value,
                symmetry: document.getElementById('symmetry-select').value,
                theme: document.getElementById('theme-select').value,
                turbulence: document.getElementById('turbulence-slider').value
            };
            localStorage.setItem('aroha_preset_v34', JSON.stringify(preset));
            alert("Preset Saved Successfully!");
        });

        document.getElementById('load-preset-btn').addEventListener('click', () => {
            const saved = localStorage.getItem('aroha_preset_v34');
            if (!saved) {
                alert("No saved preset found.");
                return;
            }
            const preset = JSON.parse(saved);
            preset.faders.forEach(f => {
                const slider = document.querySelector(`input[data-fader="${f.idx}"]`);
                if (slider) {
                    slider.value = f.value;
                    window.acousticEngine.setFaderGain(parseInt(f.idx), parseFloat(f.value));
                }
            });
            document.getElementById('focus-preset').value = preset.focusPreset;
            if (preset.scale) {
                document.getElementById('scale-select').value = preset.scale;
                if (window.scaleEngine) window.scaleEngine.setScale(preset.scale);
            }
            if (preset.symmetry) {
                document.getElementById('symmetry-select').value = preset.symmetry;
                if (window.arohaVisualizer) window.arohaVisualizer.setSymmetry(preset.symmetry);
            }
            if (preset.theme) {
                document.getElementById('theme-select').value = preset.theme;
                if (window.themeEngine && window.arohaVisualizer) window.themeEngine.applyTheme(preset.theme, window.arohaVisualizer.layers);
            }
            if (preset.turbulence) {
                document.getElementById('turbulence-slider').value = preset.turbulence;
                if (window.arohaVisualizer) window.arohaVisualizer.setTurbulence(preset.turbulence);
            }
            alert("Preset Loaded Successfully!");
        });

        let recordingActive = false;
        document.getElementById('record-btn').addEventListener('click', () => {
            if (!window.acousticEngine || !window.acousticEngine.audioCtx || !window.acousticEngine.masterGain) {
                alert("Please click 'Initialize Audio, MIDI & Visualizer Engine' first.");
                return;
            }

            const canvasEl = document.querySelector('#canvas-container canvas');
            if (!canvasEl) {
                alert("Visualizer canvas not found.");
                return;
            }

            if (!recordingActive) {
                window.arohaRecorder.startRecording(window.acousticEngine.audioCtx, window.acousticEngine.masterGain, canvasEl);
                document.getElementById('record-btn').innerText = "Stop & Download A/V Recording";
                document.getElementById('record-btn').style.background = "#059669";
                recordingActive = true;
            } else {
                window.arohaRecorder.stopRecording();
                document.getElementById('record-btn').innerText = "Start A/V Performance Recording";
                document.getElementById('record-btn').style.background = "#b91c1c";
                recordingActive = false;
            }
        });

        let binauralActive = false;
        document.getElementById('toggle-binaural').addEventListener('click', () => {
            if (!window.acousticEngine || !window.acousticEngine.audioCtx) {
                alert("Please click 'Initialize Audio, MIDI & Visualizer Engine' first.");
                return;
            }
            
            const offset = parseFloat(document.getElementById('focus-preset').value);
            if (!binauralActive) {
                window.binauralEngine.startSession(432, offset);
                document.getElementById('toggle-binaural').innerText = "Stop Binaural Entrainment";
                document.getElementById('toggle-binaural').style.background = "#059669";
                binauralActive = true;
            } else {
                window.binauralEngine.stopSession();
                document.getElementById('toggle-binaural').innerText = "Start Binaural Entrainment";
                document.getElementById('toggle-binaural').style.background = "#1f1f28";
                binauralActive = false;
            }
        });
    </script>
</body>
</html>
