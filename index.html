<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroha System Workspace</title>
    <style>
        body { 
            margin: 0; 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            max-width: 700px; 
            margin: 0 auto; 
        }
        .panel { 
            background: #1e293b; 
            padding: 16px 24px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
        }
        .panel h2 { margin-top: 0; font-size: 1.2rem; }
        .panel p { margin-bottom: 6px; color: #94a3b8; font-size: 0.9rem; }
        .data-stream {
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            background: #090d16;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #1e293b;
            margin-top: 10px;
            word-break: break-all;
        }
        iframe { 
            width: 100%; 
            height: 560px; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            background: #0f172a;
        }
    </style>
</head>
<body>

<div class="grid">
    <div class="panel">
        <h2 id="sysName">Loading AROHA Matrix...</h2>
        <p id="sysDetails">Status: Initializing Core State Schema...</p>
        <div class="data-stream" id="liveStream">Awaiting engine telemetry...</div>
    </div>

    <!-- Diagnostic Visualizer Mount -->
    <iframe src="resonance_widget.html"></iframe>
</div>

<!-- Core Engine Scripts -->
<script src="aroha-engine.js"></script>
<script src="trinity-engine.js"></script>
<script>
    let pipeline;
    let coreSchema = null;

    // Load static core parameters from matrix-core.json
    fetch('matrix-core.json')
        .then(response => response.json())
        .then(data => {
            coreSchema = data;
            document.getElementById('sysName').textContent = data.system_info.name;
            document.getElementById('sysDetails').textContent = 
                `Harmonic Target: ${data.system_info.harmonic_target} | Synergy: ${data.system_info.synergy_mechanic} | Overage Threshold: ${data.system_info.overage_threshold}`;
            
            if (typeof SystemBridge !== 'undefined') {
                pipeline = new SystemBridge();
            }
        })
        .catch(err => console.error("Could not load matrix-core.json:", err));

    // Listen to real-time events from the resonance iframe
    window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "RESONANCE_UPDATE" && pipeline) {
            const output = pipeline.executeCycle(
                `Phase Vector: ${coreSchema ? coreSchema.system_info.harmonic_target : 36.6}`,
                `Offset: ${event.data.offset}, Lag: ${event.data.lag}`
            );
            
            // Display live emergent calculation directly on screen
            const streamBox = document.getElementById('liveStream');
            streamBox.textContent = `Emergent State Output: ${output.emergentResult.synthesisPayload} | Synergy: ${output.emergentResult.synergyFactor}`;
        }
    });
</script>
</body>
</html>
